<!DOCTYPE html>
<html lang="ro"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English in Colors</title>
<style>
:root{--bg:#f4f1ea;--ink:#222;--k:clamp(28px,7vw,60px);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1b1f;--ink:#eee}}
:root[data-theme="dark"]{--bg:#1b1b1f;--ink:#eee}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:12px;gap:10px}
#stage{position:relative;width:100%;max-width:900px;aspect-ratio:16/9;background:radial-gradient(circle at 88% 14%,#ffe45c 5%,#ffe45c00 5.2%),linear-gradient(#7ec8ff,#d6f0ff 58%);border-radius:14px;overflow:hidden}
.cl{position:absolute;background:#fff;border-radius:50px;opacity:1;animation:drift 40s linear infinite}
.cl::before,.cl::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cl::before{width:45%;height:160%;left:15%;top:-70%}.cl::after{width:35%;height:130%;left:50%;top:-45%}
@keyframes drift{from{transform:translateX(-20%)}to{transform:translateX(30%)}}
#ground{position:absolute;left:0;bottom:0;width:100%;height:42%}
.fl{position:absolute;font-size:clamp(10px,2.4vw,22px);line-height:1}
#fox{position:absolute;left:1%;bottom:3%;width:30%;z-index:2;animation:bob 2.8s ease-in-out infinite;transform-origin:50% 100%;pointer-events:none}
#fox.hop{animation:hop .45s}
#fox.spin{animation:spin .95s ease-in-out}
@keyframes spin{0%{transform:perspective(700px) rotateY(0)}50%{transform:perspective(700px) rotateY(180deg) translateY(-5%)}100%{transform:perspective(700px) rotateY(360deg)}}
@keyframes bob{50%{transform:scaleY(1.012)}}
@keyframes hop{40%{transform:translateY(-8%)}}
#words:empty{display:none}
#words{position:absolute;left:37%;bottom:13%;display:flex;flex-direction:column;gap:calc(var(--k)*.12);padding:calc(var(--k)*.22) calc(var(--k)*.3) calc(var(--k)*.08);margin-left:calc(var(--k)*-.3);z-index:1}
#words::before{content:"";position:absolute;inset:calc(var(--k)*-.7) calc(var(--k)*-1) calc(var(--k)*-.4);z-index:-1;pointer-events:none;background:#ffffff00;backdrop-filter:blur(0px);-webkit-backdrop-filter:blur(0px);transition:backdrop-filter 1.4s ease,-webkit-backdrop-filter 1.4s ease;-webkit-mask-image:linear-gradient(to right,transparent,#000 24%,#000 76%,transparent),linear-gradient(to bottom,transparent,#000 26%,#000 80%,transparent);mask-image:linear-gradient(to right,transparent,#000 24%,#000 76%,transparent),linear-gradient(to bottom,transparent,#000 26%,#000 80%,transparent);-webkit-mask-composite:source-in;mask-composite:intersect}
#words.show::before{backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.w{display:flex;gap:calc(var(--k)*.05);padding:3px;border-radius:12px}
.w.hl{}
.k{width:var(--k);height:var(--k);display:flex;align-items:center;justify-content:center;background:#fff;border:1.5px solid #000;border-radius:10px;font:700 calc(var(--k)*.64)/1 Georgia,serif;color:#2b3a4d;opacity:0}
.w.on .k{opacity:1}
.k.t.lit{color:#1fa83a}
.k.t.lit.o{color:#f08a1c}
#cube.o{border-color:#f08a1c;color:#f08a1c}
#curtain{position:absolute;left:31%;top:34%;width:56%;height:66%;background:#e9eef7b8;border:0;border-radius:6px;transform-origin:center;transform:translate(-90%,-35%) scale(.1) rotate(-25deg);opacity:0;z-index:3}
#curtain.down{opacity:1;transform:none;animation:throw .95s cubic-bezier(.3,.7,.4,1),flutter 2.6s ease-in-out .95s infinite}
@keyframes flutter{0%,100%{transform:skewX(0) translateY(0) scaleX(1)}25%{transform:skewX(.9deg) translateY(-.5%) scaleX(1.004)}50%{transform:skewX(-.7deg) translateY(.4%) scaleX(.997)}75%{transform:skewX(.5deg) translateY(-.3%) scaleX(1.002)}}
@keyframes throw{0%{opacity:1;transform:translate(-90%,-35%) scale(.1) rotate(-25deg)}45%{opacity:1;transform:translate(-30%,-45%) scale(.55) rotate(12deg)}75%{transform:translate(2%,6%) scale(1.04) rotate(-2deg)}100%{transform:none}}
#curtain.fly{opacity:1;transform:translate(45%,-135%) rotate(14deg);transition:transform .8s ease-in}
#cube{position:absolute;left:70%;top:-30%;width:15%;aspect-ratio:1;background:#fff;border:6px solid #1fa83a;border-radius:14px;color:#1fa83a;font:700 clamp(40px,10vw,90px)/1 Georgia,serif;display:flex;align-items:center;justify-content:center;z-index:2;transition:top .8s,left .8s,opacity .4s}
#table{position:absolute;left:34.5%;width:38%;bottom:4%;height:9%;background:linear-gradient(#cf9658,#b07a43) top/100% 42% no-repeat;border-radius:5px;z-index:1}
#table::before,#table::after{content:"";position:absolute;bottom:0;width:4.5%;height:60%;background:linear-gradient(90deg,#8d5f33,#a06c3a);border-radius:2px}
#table::before{left:5%}#table::after{right:5%}

#bubble.on{opacity:1}

#board{position:absolute;left:30%;top:8%;width:62%;height:56%;background:#fff;border:8px solid #8a6a3b;border-radius:8px;display:flex;align-items:center;justify-content:center;font:700 clamp(22px,5.5vw,52px) Georgia,serif;color:#111;text-align:center;padding:4%;transform:scale(0);transition:transform .5s;z-index:4}
#board.on{transform:scale(1)}
#board b{transition:color .4s;font-weight:700}
#board b.lit{color:#1fa83a}
#board b.lit.o{color:#f08a1c}
#board b.lit.bl{color:#1b3a8a}
#board b.lit.gr{color:#8a8f98}
#board b.d{position:relative}
#board b.lit.d{color:#111}
#board b.d::after{content:"";position:absolute;left:50%;top:.2em;width:.15em;height:.15em;border-radius:50%;background:#111;transform:translateX(-50%) scale(0);transition:transform .3s}
#board b.lit.d::after{transform:translateX(-50%) scale(1)}
#board b.lit.r{color:#d62828}
#board b.lit.u{text-decoration:underline;text-decoration-thickness:.09em;text-underline-offset:.14em}
#spark{position:absolute;inset:0;pointer-events:none;z-index:6}
.sp{position:absolute;font-size:24px;animation:fly 1s forwards}
@keyframes fly{to{transform:translate(var(--x),var(--y)) scale(.3);opacity:0}}
#fade{position:absolute;inset:0;background:#fff;opacity:0;transition:opacity 1.2s;z-index:9;display:flex;align-items:center;justify-content:center;font:700 clamp(40px,11vw,96px) system-ui;color:#1fa83a}
.gw{display:inline-block;margin:0 .14em;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.gw.p{transform:scale(1.35)}
#fade.on{opacity:1}
button{font:600 16px system-ui;padding:.6em 1.4em;border:0;border-radius:10px;background:#1fa83a;color:#fff;cursor:pointer}

function whoosh(){try{const c=ac(),n=c.sampleRate*.5,b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.sin(Math.PI*i/n);const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();f.type="bandpass";f.Q.value=1.2;f.frequency.setValueAtTime(500,c.currentTime);f.frequency.exponentialRampToValueAtTime(3000,c.currentTime+.5);g.gain.value=.5;s.buffer=b;s.connect(f);f.connect(g);g.connect(c.destination);s.start()}catch(e){}}

 const L=Math.min(...ks.map(r=>r.left))-s.left-m,T=Math.min(...ks.map(r=>r.top))-s.top-m,R=Math.max(...ks.map(r=>r.right))-s.left+m,B=Math.max(...ks.map(r=>r.bottom))-s.top+m,c=curtain.style;
